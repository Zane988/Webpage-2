<!DOCTYPE html>
<html lang="en">
 <head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <title>Music</title>

     <style>
        html { scroll-behavior: smooth; }
        * { 
            -webkit-tap-highlight-color: transparent; 
            image-rendering: optimizeQuality; 
            text-rendering: optimizeLegibility; 
            shape-rendering: auto; 
            
        }
        a, button, .item { outline: none; }

        body {
            background: linear-gradient(180deg, #000000 20%, #0e0f13 60%);
            background-attachment: fixed; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            color: white;
            padding: 40px;
            margin: 0;
            overflow-x: hidden;
        }

        .nav-wrapper {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 70px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.9);
            z-index: 999;
        }
        
        .nav {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            justify-content: space-between;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            background: rgba(190, 190, 190, 0.09);
        }

        .header-format {
            position: absolute; 
            font-size: 28px;
            font-weight: 600;
            margin-left: 10%;
            padding-left: 50px;
            padding-top: 2px;
        }

        .nav-icon {
            height: 40px;
            width: auto;
            margin-left: 10%;
            cursor: pointer;
        }

        .nav-items {
            display: flex;
            margin-right: 10%;
            gap: 30px;
        }

        .nav-text {
            display: inline;
        }

        .nav-img {
            display: none;
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .item { color: white; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; text-decoration: none; }
        .item:hover { transform: scale(1.1); color: #bbb; }

        .nav-indicator {
            display: none;
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background-image:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 140px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 180px),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.01) 0 1px, transparent 1px 25px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.01) 0 1px, transparent 1px 40px);
            background-size: 20% 20%;
        }

        .music-row { margin-top: 50px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .music-nav-row { 
            margin-top: 10px;
            display: flex; 
            justify-content: center;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
        }

        @property --song-color {
            syntax: '<color>';
            inherits: true;
            initial-value: rgba(34, 34, 34, 1);
        }
        
        .box-music-bg {
            position: relative;
            width: 270px;
            height: 290px;
            border-radius: 15px;
            background: rgba(235, 235, 235, 0.095);
            border: 1px solid #858585;
            
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center;
            padding: 20px;
            
            z-index: 1;
        }

        .video-container {
            position: relative;
            background: transparent;
            border: 1px solid #858585;
            
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center;
            
            z-index: 1;
        }

        .box-music-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, var(--song-color) 100%);
            transition: opacity 0.8s ease, --song-color 1.5s ease-in-out;
            opacity: 0.3;
            z-index: -1;
            border-radius: 15px;
            
            background-size: 100% 200%;
            animation: as 5s ease-in-out infinite alternate;
        }

        @keyframes as {
            from {
                background-position: 0% 50%;
            }
            to {
                background-position: 0% 90%;
            }
        }

        .box-music-bg.is-playing::after {
            opacity: 0.56;
        }

        .box-music-cover {
            width: 250px; 
            height: 220px;
            border-radius: 15px;
            background-size: cover;
            background-position: center;
            background-image: url("no-image.png");
            background-color: #222;
            margin-bottom: 15px;
        }

        .box-music-cover img {
            
            width: 250px;
            height: 220px;
            object-fit: cover; 
            object-position: center; 
            border-radius: 15px;
        }

        .song-li-name { 
            margin: 10px 0 0 0;
            font-size: 13px; 
            font-weight: bold;
        }

        .song-li-author { 
            margin: 5px 0 0 0;
            font-size: 9px; 
            color: #aaa; 
        }

        @property --x1 { syntax: '<percentage>'; inherits: false; initial-value: 20%; }
        @property --y1 { syntax: '<percentage>'; inherits: false; initial-value: 30%; }
        @property --x2 { syntax: '<percentage>'; inherits: false; initial-value: 80%; }
        @property --y2 { syntax: '<percentage>'; inherits: false; initial-value: 20%; }
        @property --x3 { syntax: '<percentage>'; inherits: false; initial-value: 50%; }
        @property --y3 { syntax: '<percentage>'; inherits: false; initial-value: 80%; }

        @property --dynamic-color {
            syntax: '<color>';
            inherits: false;
            initial-value: rgba(100, 150, 200, 0.1);
        }

        .box-an-bg {
            width: 795px;
            height: 330px;
            border-radius: 15px;
            background: rgba(235, 235, 235, 0.08);
            border: 1px solid #858585;
            position: relative;

            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center;

            background-image: 
                radial-gradient(ellipse at var(--x1) var(--y1), rgba(100, 100, 255, 0.1) 0%, transparent 80%),
                radial-gradient(ellipse at var(--x2) var(--y2), var(--dynamic-color) 0%, transparent 80%),
                radial-gradient(ellipse at var(--x3) var(--y3), rgba(100, 200, 255, 0.2) 0%, transparent 80%);

            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            transition: --dynamic-color 4s cubic-bezier(0.47, 0, 0.745, 0.715), --x1 4s cubic-bezier(0.47, 0, 0.745, 0.715), --y1 4s cubic-bezier(0.47, 0, 0.745, 0.715), --x2 4s cubic-bezier(0.47, 0, 0.745, 0.715), --y2 4s ease, --x3 4s cubic-bezier(0.47, 0, 0.745, 0.715), --y3 4s cubic-bezier(0.47, 0, 0.745, 0.715);
        }

        .bg-video {
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center;
        }

        .marquee-container {
            width: 95%; 
            margin: 0 auto;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            height: 35px;
            top: -10px;
        }

        .song-name
        {
            margin: 0;
            white-space: nowrap;
            position: absolute;
            left: 0;
            width: max-content;
            font-size: 32px;
        }

        .song-author {
            margin: 0;
            white-space: nowrap;
            position: absolute;
            left: 0;
            width: max-content;
            color: #acacac;
        }

        .animate-marquee {
            will-change: transform;
            animation: marquee-bounce 6s ease-in-out infinite alternate;
        }
        
        @keyframes marquee-bounce {
            0% { 
                transform: translateX(0); 
            }
            100% { 
                transform: translateX(var(--bounce-dist)); 
            }
        }

        /* AAAAAAAAAAAAAAAAAAAA LERECA*/

        .box-lyric-bg {
            position: relative;
            width: 535px;
            height: 290px;
            border-radius: 15px;
            background: rgba(235, 235, 235, 0.095);
            border: 1px solid #858585;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 1;
            overflow: hidden; 
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), padding 0.5s;
            max-height: 290px; 
        }

        .box-selection-bg {
            position: relative;
            width: 490px;
            height: 290px;
            border-radius: 15px;
            background: rgba(235, 235, 235, 0.095);
            border: 1px solid #858585;
            
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center;
            padding: 20px;
            
            z-index: 1;
        }

        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 30px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .box-title {
            margin: 0;
            font-size: 24px;
        }

        .minimize-btn {
            cursor: pointer;
            opacity: 0.7;
            transition: 0.2s;
            margin-right: 10px;
        }

        .minimize-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .lyric-scroll-area {
            margin-top: -20px;
            width: 100%;
            height: 220px;
            overflow-y: auto;
            padding: 20px 0;
            white-space: pre-line;
            font-size: 18px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;

            -webkit-mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                black 20%,
                black 80%,
                transparent 100%
            );
            mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                black 20%,
                black 80%,
                transparent 100%
            );

            scrollbar-width: none; 
        }
        .lyric-scroll-area::-webkit-scrollbar { display: none; }

        .box-lyric-bg.minimized {
            max-height: 60px; 
            padding-bottom: 0;
        }

        .lyric-scroll-area {
            width: 100%;
            flex-grow: 1;
            overflow-y: auto;
            text-align: center;
            transition: opacity 0.3s;
        }

        .box-lyric-bg.minimized .lyric-scroll-area {
            opacity: 0;
            pointer-events: none;
        }

        .progress-container { 
            width: 90%; 
            margin: 90px auto 0 auto; 
        }

        .time-stamps { 
            display: flex; 
            justify-content: space-between; 
            font-size: 12px; color: #888; 
            margin-bottom: 5px; 
            
        }

        .progress-bar { 
            position:  relative;  
            width: 100%; 
            height: 4px; 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 2px; 
        }

        .progress-bar::before {
            content: "";
            position: absolute;
            top: -12px;
            bottom: -12px;
            left: 0;
            right: 0;
        }

        .progress-fill { 
            width: 0%; 
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); 
            height: 100%; 
            background: white; 
            border-radius: 2px;
        }

        .controls-wrapper {
            position: absolute;
            top: 245px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            width: 100%;
        }

        #heart-svg path {
            transition: fill 0.4s ease, stroke 0.4s ease;
        }

        #repeat-svg path {
            transition: fill 0.4s ease, stroke 0.4s ease;
        }

        .side-btn { cursor: pointer; transition: 0.2s;}
        .side-btn:hover { transform: scale(1.2); }

        .play-icon {
            width: 60px; height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .play-icon svg { width: 40px; height: 40px; fill: rgb(68, 68, 68); }
        .play-icon:hover { transform: scale(1.1); background: #eee; }

        .progress-dot {
            position: absolute;
            top: 50%;
            left: 0%; 
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transition: transform 0.1s;
            pointer-events: none;
            z-index: 10;
        }

        .progress-bar:hover .progress-dot {
            transform: translate(-50%, -50%) scale(1.3);
        }

        /*
            THE NEW ONE I AM WORKING
            A
            A
            A
            A
            A

            AA
            AA

        */

        .playlist-main {
            width: 95%;
            position: relative;
            display: flex; 
            margin-top: 10px;
            margin-left: 30px;
            align-items: flex-start;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
            flex-grow: 1;
            
            flex-wrap: nowrap;

            -webkit-mask-image: linear-gradient(
                to right,
                transparent,
                black 10%,
                black 90%,
                transparent
            );
            mask-image: linear-gradient(
                to right,
                transparent,
                black 10%,
                black 90%,
                transparent
            );
        }

        .playlist-main::-webkit-scrollbar {
            display: none;
        }

        .playlist-group {
            display: flex;
            gap: 10px;
            padding: 50px 40px;
        }

        .pl-bg {
            width: 220px;
            height: 70px;
            border-radius: 12px;
            background: rgba(235, 235, 235, 0.095);
            border: 1px solid #858585;

            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;

            flex-shrink: 0;
            cursor: pointer;
            transition: 0.2s;
        }

        .pl-bg:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.03);
        }

        .pl-img {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            object-fit: cover;
        }

        .pl-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pl-name {
            font-size: 13px;
            font-weight: bold;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pl-author {
            font-size: 11px;
            color: #aaa;
            margin: 0;
        }

        /* AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA */

        /* FOR MOBILE ARGHHH */

        @media (max-width: 800px) {
            .nav-wrapper {
                top: auto;
                bottom: 0;
                height: 70px;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                box-shadow: none;
            }

            .nav {
                background: linear-gradient(
                    to top,
                    rgba(0,0,0,1) 0%,
                    rgba(0,0,0,0.85) 25%,
                    rgba(0,0,0,0.6) 55%,
                    rgba(0,0,0,0.3) 80%,
                    transparent 100%
                );
                border-radius: 0;
                height: 100%;
                justify-content: center;
            }

            .header-format,
            .nav-icon {
                display: none;
            }

            .nav-text {
                display: none;
            }

            .nav-img {
                display: block;
                width: 32px;
                height: 32px;
                filter: brightness(0) invert(1);
            }

            .item {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .nav-items {
                width: 100%;
                justify-content: center;
                gap: 70px;
                margin: 0;
            }

            body {
                padding-bottom: 100px;
            }

            .nav-indicator {
                display: block;
                position: absolute;
                top: -12px;
                left: 50%;
                transform: translateX(315%);
                width: 28px;
                height: 28px;

                animation: float1 4s ease-in-out infinite;

                transition: none;
                pointer-events: none;
            }

            @keyframes float1 {
                0% {
                    transform: translateY(0px) translateX(315%);
                }
                50% {
                    transform: translateY(-8px) translateX(315%);
                }
                100% {
                    transform: translateY(0px) translateX(315%);
                }
            }

            /*6767676767677676767676767676767676*/

            .music-row { 
                flex-direction: column; 
                align-items: center; 
                gap: 10px;
                width: 100%;
                margin-top: -10px;
            }

            .music-nav-row { 
                flex-direction: column; 
                align-items: center; 
                gap: 10px;
                width: 100%;
                margin-top: 10px;
            }

            .playlist-main {
                flex-direction: row; 
                align-items: center; 
                gap: 10px;
                width: 100%;
                margin-top: 10px;
            }

            .box-music-bg{ 
                display: flex;
                width: 95% !important;
                height: auto;
                min-height: 250px; 
                transition: opacity 0.7s ease;
                padding-bottom: 30px;
                flex-direction: column;
                align-items: center;
            }

            .box-lyric-bg
            { 
                width: 95% !important;
                height: auto;
                padding-bottom: 30px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .box-selection-bg { 
                width: 95% !important;
                height: auto;
                min-height: 250px; 
                padding-bottom: 30px;
                display: none;
                flex-direction: column;
                align-items: center;
            }

            .box-an-bg { 
                width: 105% !important;
                height: auto;
                min-height: 250px; 
                padding-bottom: 30px;
                position: relative;

                display: flex;
                flex-direction: column;
                align-items: center; 
                text-align: center;
            }

            .progress-container 
            { 
                width: 90%; 
                /* margin: 40px auto 0 auto; */
            }

            .controls-wrapper { 
                position: relative;
                top: 5px;
                transform: none; 
                left: 0;
                transform: translateX(0%);
                margin-top: 20px;
            }
            
            .song-name { padding: 5px 5px; margin-left: 0; text-align: center; font-size: 24px; }
            .song-author { padding: 0px 5px; margin-left: 0; text-align: center; }

            .box-music-bg h1 {
                align-self: flex-start !important; 
                margin: 0px 0 0px -25px !important;
                text-align: left !important;
            }

            .playlist-main {
                width: 100%;
                position: relative;
                display: flex; 
                margin-top: 10px;
                margin-left: 0px;
            }

            .playlist-group {
                padding: 20px 40px;
            }
        }

        .visualizer {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 50%;
            height: 80px;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 0;

            will-change: transform;
        }
     </style>
 </head>

 <body>
    <div id="music">
        <div class="nav-wrapper">
            <div class="nav">
                <p class="header-format">
                    Music
                </p>
                <img src="icon/favicon.ico" alt="Icon" class="nav-icon">

                <div class="nav-items">
                    <img src="icon/favicon.ico" class="nav-indicator">

                    <a href="index.html" class="item">
                        <span class="nav-text">MAIN</span>
                        <img src="icon/memories.png" class="nav-img">
                    </a>

                    <a href="gallery.html" class="item">
                        <span class="nav-text">GALLERY</span>
                        <img src="icon/gallery.png" class="nav-img">
                    </a>

                    <a href="#music" class="item">
                        <span class="nav-text">MUSIC</span>
                        <img src="icon/music.png" class="nav-img">
                    </a>
                </div>
            </div>
        </div>
        
        <div class="music-row">
            <div class="bg-video"></div>
            <div class="box-music-bg">
                
                <div class="box-music-cover"></div>
                <p class="song-li-name" id="display-li-name">
                    Through the Years
                </p>
                <p class="song-li-author" id="display-li-author">Unknown Artist</p>
            </div>

            <div class="box-an-bg">
                <div class="marquee-container" style="margin-top: 30px;">
                    <h3 class="song-name" id="display-name">Through the Years</h3>
                </div>
                <div class="marquee-container">
                    <p class="song-author" id="display-author">Unknown Artist</p>
                </div>

                <div class="progress-container">
                    <div class="time-stamps">
                        <span id="curr-time">0:00</span>
                        <span id="total-time">0:00</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                        <div class="progress-dot" id="progress-dot"></div>
                    </div>
                </div>

                <div class="controls-wrapper">
                    <div class="side-btn" id="repeat-btn" onclick="toggleRepeat()">
                        <svg id="repeat-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="17 1 21 5 17 9"></polyline>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                            <polyline points="7 23 3 19 7 15"></polyline>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                        </svg>
                    </div>

                    <div class="side-btn" onclick="prevSong()">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M6 6h2v12H6zm3.5 6L19 18V6z"/></svg>
                    </div>

                    <div class="play-icon" id="play-trigger">
                        <svg id="play-svg" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </div>

                    <div class="side-btn" onclick="nextSong()">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </div>

                    <div class="side-btn" id="heart-btn" onclick="hearty()">
                        <svg id="heart-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
        <svg id="visualizer" class="visualizer" xmlns="http://www.w3.org/2000/svg"></svg>

        <div class="playlist-main">
            <div class="playlist-group">
                <div class="pl-bg">
                    <img class="pl-img" src="cover.jpg">
                    <div class="pl-info">
                        <p class="pl-name">Song Name</p>
                        <p class="pl-author">Artist</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="music-nav-row">
            <div class="box-lyric-bg">
                <div class="box-header">
                    <h1 class="box-title">Lyrics</h1>
                    <div class="minimize-btn" onclick="toggleMinimize()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line> 
                        </svg>
                    </div>
                </div>
                <div class="lyric-scroll-area" id="lyric-content">
                    </div>
            </div>

            <div class="box-selection-bg">
                
            </div>
        </div>

        <div class="grid-bg"></div>
    </div>

    <script src="SpectralAnalyzer.js"></script>
    <script>
        const musicEngine = new Audio();

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaElementSource(musicEngine);
        source.connect(audioContext.destination);
        
        let videoEngine = null;
        
        let playlist = [];
        let currentIndex = 0;
        let isPlaying = false;
        let hasVideo = false;
        let isVideoSeeking = false;
        let resyncTimeout = null;

        const songNameEl = document.getElementById('display-name');
        const songAuthorEl = document.getElementById('display-author');

        const songNameLi = document.getElementById('display-li-name');
        const songAuthorLi = document.getElementById('display-li-author');

        const playBtn = document.getElementById('play-trigger');
        const playSvg = document.getElementById('play-svg');

        let heartTimeout = null;
        
        let analyzer = null;
        let audioLevels = [];

        async function loadPlaylist() 
        {
            const response = await fetch('musics.json'); //so its a fetch huh
            const data = await response.json();
            playlist = data.musics;
            updatePlayer();
            somontheplaylest()
        }

        const coverEl = document.querySelector('.box-music-bg');

        function updatePlayer() 
        {
            if (playlist.length > 0) 
            {
                const song = playlist[currentIndex];

                songNameEl.innerText = song.name;
                songAuthorEl.innerText = song.author || "Unknown Artist";
                songNameLi.innerText = song.name;
                songAuthorLi.innerText = song.author || "Unknown Artist";

                if (song.color) {
                    coverEl.style.setProperty('--song-color', song.color);
                    updateGlowColor(song.color)
                } else {
                    coverEl.style.setProperty('--song-color', '#222');
                    updateGlowColor('#222')
                }
                
                if (song.video && mobileQuery.matches) {
                    hasVideo = true;
                    loadVideo(song.video);
                } else {
                    hasVideo = false;
                }

                const coverl = document.querySelector('.box-music-cover');

                if (song.icon) 
                {
                    coverl.style.backgroundImage = `url('${song.icon}.jpg')`;
                    coverl.style.backgroundSize = 'cover'; 
                    coverl.style.backgroundPosition = 'center';
                } 
                else 
                {
                    coverl.style.backgroundImage = `url('no-image.png')`;
                }

                handleMarquee(songNameEl);
                handleMarquee(songAuthorEl);
                
                musicEngine.src = song.file;
                document.getElementById('progress-fill').style.width = '0%';

                loadLyrics(song.lrc || null);

                let videoEl = document.querySelector(".bg-video");

                if (!analyzer) 
                {
                    analyzer = new SpectralAnalyzer(source, 7, 0.1, (mobileQuery.matches) ? 5 : 40, (mobileQuery.matches) ? 64 : 256);
                }
            }
        }

        musicEngine.addEventListener("loadedmetadata", () => {
            const totTimeEl = document.getElementById('total-time');
            totTimeEl.innerText = formatTime(musicEngine.duration);
        });

        function toggleMinimize() 
        {
            const lyricBox = document.querySelector('.box-lyric-bg');
            lyricBox.classList.toggle('minimized');
        }

        async function loadLyrics(url) 
        {
            if(!url)
            {
                document.getElementById('lyric-content').innerText = "\n\n\nNo lyrics provided.";
                document.getElementById('lyric-content').scrollTop = 0;
                return;
            }

            const res = await fetch(url + '.txt');
            const text = await res.text();
            console.log("ly: ", text);
            
            const notag = text.replace(/\[.*?\]/g, '').trim();
            
            document.getElementById('lyric-content').innerText = notag;
            document.getElementById('lyric-content').scrollTop = 0;
        }

        const box = document.querySelector('.box-an-bg');

        function hexToRGBA(hex, alpha) 
        {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function updateGlowColor(hexCode) 
        {
            const finalColor = hexToRGBA(hexCode, 0.23);
            box.style.setProperty('--dynamic-color', finalColor);
        }

        const mobileQuery = window.matchMedia("(max-width: 800px)");

        function handleMarquee(element) 
        {
            const container = element.parentElement;

            element.classList.remove('animate-marquee');
            element.style.transform = "translateX(0)";
            element.style.removeProperty('--bounce-dist');

            void element.offsetWidth;

            const style = getComputedStyle(container);
            const paddingLeft = parseFloat(style.paddingLeft);
            const paddingRight = parseFloat(style.paddingRight);

            const containerWidth = Math.floor(container.getBoundingClientRect().width);
            const textWidth = Math.ceil(element.getBoundingClientRect().width);

            //console.log(containerWidth)

            if (textWidth > containerWidth) 
            {
                const overflow = textWidth - containerWidth;
                console.log(overflow)

                element.style.setProperty('--bounce-dist', `-${overflow}px`);
                element.classList.add('animate-marquee');
            }
        }

        let repet = 0;

        function toggleRepeat(isOnce = false) 
        {
            if(!isOnce) repet = (repet + 1) % 3;
            const repeatBtn = document.getElementById('repeat-btn');
            const repeatSvg = document.getElementById('repeat-svg');
            
            if (repet === 0) 
            {
                repeatSvg.style.stroke = "grey";
                repeatSvg.innerHTML = '<polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path>';
            } 
            else if (repet === 1)
            {
                repeatSvg.style.stroke = "white";
            } 
            else if (repet === 2) 
            {
                repeatSvg.innerHTML += '<path d="M11 10h1v4" stroke-width="1.5"></path>';
            }
        }
        toggleRepeat(true)

        function hearty()
        {
            const heartSvg = document.getElementById('heart-svg');
            
            if(heartTimeout)
                clearTimeout(heartTimeout)

            heartSvg.style.fill = 'red';
            heartSvg.style.stroke = 'red';

            heartTimeout = setTimeout(() => {
                heartSvg.style.fill = 'transparent';
                heartSvg.style.stroke = 'white';
            }, 2000)
        }

        function nextSong() 
        {
            currentIndex = (currentIndex + 1) % playlist.length;
            updatePlayer();

            if (isPlaying) 
            {
                musicEngine.play();
                if(videoEngine) videoEngine.play();
                coverEl.classList.add('is-playing');
                showVideo()

            }
            else
                showVideo();
        }

        function prevSong() 
        {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            updatePlayer();

            if (isPlaying) 
            {
                musicEngine.play();
                if(videoEngine) videoEngine.play();
                coverEl.classList.add('is-playing');
                showVideo();
            }
            else
                showVideo();
        }
        loadPlaylist();

        playBtn.addEventListener('click', () => 
        {
            isPlaying = !isPlaying;

            if (audioContext.state === "suspended") 
            {
                audioContext.resume();
            }
            
            if (isPlaying) 
            {
                playSvg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                musicEngine.play();
                musicEngine.volume = 1;
                if(videoEngine) videoEngine.play();
                coverEl.classList.add('is-playing');
                showVideo()
            } 
            else 
            {
                playSvg.innerHTML = '<path d="M8 5v14l11-7z"/>';
                musicEngine.pause();
                if(videoEngine) videoEngine.pause();
                coverEl.classList.remove('is-playing');
                showVideo()
            }
        });

        function showVideo()
        {
            const musicBox = document.querySelector('.box-music-bg');

            if (!hasVideo || !mobileQuery.matches) 
            {
                musicBox.style.opacity = 1;
                if (videoEngine) videoEngine.style.opacity = 0;
                return;
            }

            musicBox.style.opacity = isPlaying ? 0 : 1;
            videoEngine.style.opacity = isPlaying ? 1 : 0;
        }

        function loadVideo(src) 
        {
            if (!videoEngine) 
            {
                videoEngine = document.createElement("video");

                videoEngine.autoplay = false;
                videoEngine.muted = true;
                videoEngine.loop = false;
                videoEngine.playsInline = true;
                
                videoEngine.preload = "metadata";

                videoEngine.style.position = "absolute";
                videoEngine.style.top = "50%";
                videoEngine.style.left = "50%";
                videoEngine.style.width = "100%";
                videoEngine.style.height = "100%";

                videoEngine.style.transform = "translate(-50%, -50%)";
                videoEngine.style.objectFit = "cover";

                videoEngine.style.zIndex = "-1";
                videoEngine.style.opacity = "0";
                videoEngine.style.transition = "0.4s ease";

                videoEngine.style.webkitMaskImage = "linear-gradient(to bottom, black 10%, transparent 80%)";
                videoEngine.style.maskImage = "linear-gradient(to bottom, black 10%, transparent 80%)";

                videoEngine.style.filter = "blur(1.5px)";

                document.querySelector(".bg-video").appendChild(videoEngine);
            }

            videoEngine.pause();
            videoEngine.removeAttribute("src");
            videoEngine.load();
            videoEngine.srcObject = null;
            videoEngine.src = src;
            videoEngine.load();
        }

        musicEngine.addEventListener("timeupdate", (e) => {
            if (isNaN(musicEngine.duration)) return;

            const p = (musicEngine.currentTime / musicEngine.duration) * 100;

            const progressFill = document.getElementById('progress-fill');
            progressFill.style.width = p + "%";

            const currTimeEl = document.getElementById('curr-time');
            currTimeEl.innerText = formatTime(musicEngine.currentTime);

            const totTimeEl = document.getElementById('total-time');
            totTimeEl.innerText = formatTime(musicEngine.duration);

            document.getElementById('progress-dot').style.left = p + "%";

            if (videoEngine && !isVideoSeeking) 
            {
                const diff = Math.abs(videoEngine.currentTime - musicEngine.currentTime);
                if (diff > 0.5) 
                {
                    videoEngine.currentTime = musicEngine.currentTime;
                }
            }
        })

        musicEngine.onended = () => {
            if(repet === 0) 
            {
                isPlaying = false;
                playSvg.innerHTML = '<path d="M8 5v14l11-7z"/>';
                coverEl.classList.remove('is-playing');
            }

            if(repet === 1)
            {
                nextSong()
            }
            else if(repet === 2)
            {
                musicEngine.currentTime = 0; 
                musicEngine.play();
            }
        }

        const progressBar = document.querySelector('.progress-bar');

        progressBar.addEventListener('mousemove', (e) => {
            if(e.buttons !== 1) return;

            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            const duration = musicEngine.duration;

            musicEngine.currentTime = (clickX / width) * duration;
        });

        function formatTime(s)
        {
            if (isNaN(s)) return "0:00";

            let min = Math.floor(s / 60);
            let sec = Math.floor(s % 60);
            if (sec < 10) sec = "0" + sec;
            return min + ":" + sec;
        }

        //pls i hate this idk how to put it in single foeelarafaaf
        const grid = document.querySelector(".grid-bg");
        let x = 0, y = 0;
        let animFrameId = null;
        function animate() {
            x += 0.12; y += 0.1;
            grid.style.backgroundPosition = `0 ${y}px,${x}px 0,0 ${y * 0.4}px,${x * 0.4}px 0`;
            animFrameId = requestAnimationFrame(animate);
        }
        animate();
        
        //Hell
        function randomizeGradients() 
        {
            const box = document.querySelector('.box-an-bg');
        
            const x1 = Math.floor(Math.random() * 100);
            const y1 = Math.floor(Math.random() * 100);
            const x2 = Math.floor(Math.random() * 100);
            const y2 = Math.floor(Math.random() * 100);
            const x3 = Math.floor(Math.random() * 100);
            const y3 = Math.floor(Math.random() * 100);

            box.style.setProperty('--x1', `${x1}%`);
            box.style.setProperty('--y1', `${y1}%`);
            box.style.setProperty('--x2', `${x2}%`);
            box.style.setProperty('--y2', `${y2}%`);
            box.style.setProperty('--x3', `${x3}%`);
            box.style.setProperty('--y3', `${y3}%`);
        }
        randomizeGradients();

        let gradientInterval = setInterval(randomizeGradients, 1500);

        window.addEventListener('resize', () => {
            handleMarquee(songNameEl);
            handleMarquee(songAuthorEl);
        });

        mobileQuery.addEventListener("change", () => {
            showVideo();
        });

        function resyncVideo() 
        {
            if (!videoEngine || !musicEngine) return;

            if (resyncTimeout) clearTimeout(resyncTimeout);

            resyncTimeout = setTimeout(() => {
                isVideoSeeking = true;

                const targetTime = musicEngine.currentTime;

                videoEngine.pause();
                videoEngine.currentTime = targetTime;

                const onSeeked = () => {
                    isVideoSeeking = false;

                    if (isPlaying)
                    {
                        videoEngine.play().catch(() => {});
                    }

                    videoEngine.removeEventListener('seeked', onSeeked);
                };

                videoEngine.addEventListener('seeked', onSeeked);
            }, 5000);
        }

        document.addEventListener("visibilitychange", (e) => {

            if (document.hidden) {
                console.log("SSSSSSSSSS")
                // Pause background animations to free up CPU
                cancelAnimationFrame(animFrameId);
                clearInterval(gradientInterval);
            } else {
                // Resume animations
                animate();
                console.log("SSSSSSSSSSssssssssssss")
                gradientInterval = setInterval(randomizeGradients, 1500);
                resyncVideo();
            }
        });

        window.addEventListener("focus", () => {
            resyncVideo();
            console.log("A")
        });


        const container = document.querySelector('.playlist-main');

        container.addEventListener('wheel', (e) => {
            e.preventDefault();

            container.scrollBy({
                left: e.deltaY,
                behavior: 'smooth'
            });
        });

        const playlistContainer = document.querySelector('.playlist-group');

        function somontheplaylest() 
        {
            playlistContainer.innerHTML = "";

            playlist.forEach((song, index) => 
            {
                const item = document.createElement("div");
                item.className = "pl-bg";

                item.innerHTML = `
                    <img class="pl-img" src="${song.icon ? song.icon + '.jpg' : 'no-image.png'}">
                    <div class="pl-info">
                        <p class="pl-name">${song.name}</p>
                        <p class="pl-author">${song.author || "Unknown Artist"}</p>
                    </div>
                `;

                item.addEventListener("click", () => {
                    currentIndex = index;
                    updatePlayer();

                    isPlaying = true;
                    playSvg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                    musicEngine.play();
                    if(videoEngine) videoEngine.play();
                    coverEl.classList.add('is-playing');
                    showVideo();
                });

                playlistContainer.appendChild(item);
            });
        }

        const svg = document.getElementById("visualizer");
        let svgBars = [];
        let svgW = 0, svgH = 0;

        function initSvgBars(count) {
            svg.innerHTML = "";
            svgBars = [];
            svgW = svg.clientWidth || svg.getBoundingClientRect().width || window.innerWidth;
            svgH = svg.clientHeight || svg.getBoundingClientRect().height || 80;
            svg.setAttribute("viewBox", `0 0 ${svgW} ${svgH}`);
            svg.setAttribute("preserveAspectRatio", "none");
            const barWidth = svgW / count;
            for (let i = 0; i < count; i++) {
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", i * barWidth);
                rect.setAttribute("y", svgH);
                rect.setAttribute("width", Math.max(1, barWidth - 2));
                rect.setAttribute("height", 0);
                rect.setAttribute("fill", "white");
                svg.appendChild(rect);
                svgBars.push(rect);
            }
        }
        // dummy ctx placeholder removed — SVG used instead

        let resizePending = false;
        window.addEventListener("resize", () => {
            if (!resizePending) {
                resizePending = true;
                requestAnimationFrame(() => {
                    if (svgBars.length > 0) initSvgBars(svgBars.length);
                    resizePending = false;
                });
            }
        });

        setInterval(draw, 16);
        function draw() 
        {
            if (!analyzer) return;

            const levels = analyzer.getLevels(audioLevels);

            if (svgBars.length !== levels.length) 
            {
                initSvgBars(levels.length);
            }

            const h = svgH;
            const w = svgW;
            const barWidth = (w / levels.length) | 0;

            for (let i = 0; i < levels.length; i++) 
            {
                const v = bound(levels[i].value, 0, 1);
                const bh = v * h;
                svgBars[i].setAttribute("y", h - bh);
                svgBars[i].setAttribute("height", bh);
                svgBars[i].setAttribute("x", i * barWidth);
                svgBars[i].setAttribute("width", Math.max(1, barWidth - 2));
            }
        }

        function bound(Value, Min, Max)
        {
            var lowerBound = (Min != null && Value < Min) ? Min : Value;
            return (Max != null && lowerBound > Max) ? Max : lowerBound;
        }

    </script>
 </body>
</html>
